name: CI & AppSec Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

  release:
    types: [published]

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality-and-security:
    name: Test, SAST (Bandit) & SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run deterministic test suite (pytest)
        run: pytest -v

      - name: Run static security analysis (Bandit)
        run: bandit -r src/ -ll -ii

      - name: Audit dependency tree for known CVEs (pip-audit)
        run: pip-audit --skip-editable

      - name: Generate and verify SHA-256 evidence ledger (positive + tamper gate)
        run: |
          mkdir -p artifacts/evidence
          vtx-ti-enricher export samples/sample_enrich_report.json \
            --evidence-log artifacts/evidence/evidence_ledger.jsonl \
            --asset-id pay-lnx-gw-01
          vtx-ti-enricher export samples/sample_enrich_report.json \
            --evidence-log artifacts/evidence/evidence_ledger.jsonl \
            --asset-id cde-app-win-01
          vtx-ti-enricher verify-evidence artifacts/evidence/evidence_ledger.jsonl
          python -c 'import json, pathlib; p = pathlib.Path("artifacts/evidence/evidence_ledger.jsonl"); ls = p.read_text(encoding="utf-8").splitlines(); o = json.loads(ls[0]); o["verdict"] = "benign"; pathlib.Path("/tmp/tampered_ledger.jsonl").write_text("\n".join([json.dumps(o), *ls[1:]]) + "\n", encoding="utf-8")'
          if vtx-ti-enricher verify-evidence /tmp/tampered_ledger.jsonl; then
            echo "ERROR: verify-evidence accepted a tampered ledger!" >&2
            exit 1
          fi
          rm -f /tmp/tampered_ledger.jsonl

      - name: Upload SHA-256 evidence ledger artifact
        uses: actions/upload-artifact@v7
        with:
          name: ti-evidence-ledger
          path: artifacts/evidence/evidence_ledger.jsonl
          if-no-files-found: error
          retention-days: 14

  container-and-trivy:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality-and-security
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-stage runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: vtx-ti-enricher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root execution (UID 10001) and CLI entrypoint
        run: |
          docker run --rm --entrypoint id vtx-ti-enricher:ci -u | grep -qx "10001"
          docker run --rm vtx-ti-enricher:ci version

      - name: Scan container image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "vtx-ti-enricher:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-report
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  publish-ghcr:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: [quality-and-security, container-and-trivy]
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
