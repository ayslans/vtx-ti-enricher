name: CI & AppSec Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality-and-security:
    name: Test, SAST (Bandit) & SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run deterministic test suite (pytest)
        run: pytest -v

      - name: Run static security analysis (Bandit)
        run: bandit -r src/ -ll -ii

      - name: Audit dependency tree for known CVEs (pip-audit)
        run: pip-audit --skip-editable

  container-and-trivy:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality-and-security
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-stage runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: vtx-ti-enricher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root execution (UID 10001) and CLI entrypoint
        run: |
          docker run --rm --entrypoint id vtx-ti-enricher:ci -u | grep -qx "10001"
          docker run --rm vtx-ti-enricher:ci version

      - name: Scan container image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "vtx-ti-enricher:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-report
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
